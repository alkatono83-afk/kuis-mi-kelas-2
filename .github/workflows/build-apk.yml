name: Build APK Kuis MI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android || echo "android exists"
      - name: Copy web assets
        run: npx cap copy android
      - name: Replace app icons with MI logo
        run: |
          echo "Replacing icons..."
          for dir in app-icons/mipmap-*; do
            base=$(basename $dir)
            echo "Copying $base"
            cp $dir/ic_launcher.png android/app/src/main/res/$base/ic_launcher.png || true
            cp $dir/ic_launcher_round.png android/app/src/main/res/$base/ic_launcher_round.png || true
            cp $dir/ic_launcher_foreground.png android/app/src/main/res/$base/ic_launcher_foreground.png || true
          done
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kuis-MI-Kelas-2-APK-Icon-MI
          path: android/app/build/outputs/apk/debug/app-debug.apk
